<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Student Career Portal</title>
</head>
<body>

  <header>

    <h1>Smart Student Career Portal</h1>

  </header>

  <main>

    <section>

      <h2>Welcome Back!</h2>

      <P>
        Please log in to continue
      </P>

      <form action="#" method="post">

        <fieldset>

          <legend>

            Login As:

          </legend>

            <input type="radio" id="student" name="role" value="student">

            <label for="student">Student</label>
            
            <br>

             <input type="radio"
                    id="teacher"
                    name="role"
                    value="teacher">
              

            <label for="teacher">

                    Teacher

            </label>
            
            <br>

              <input
                type="radio"
                id="admin"
                name="role"
                value="admin">

            <label for="admin">

                Admin

            </label>

          
        </fieldset>

        <br>

        <label for="email">Email Adress<span>*:</span></label>

        <input type="email" id="email" name="email" placeholder="Enater your email" required>

        <br><br>

        <label for="password">Password<span>*:</span></label>

        <input type="password" id="password" name="password" placeholder="Enter your Password" required>

        <br><br>

        <input type="checkbox" id="remember" name="remember">

        <label for="remember">Remember me</label>

        <br><br>

        <button type="submit">
          Login
        </button>

        <p>

          <a href="forgot-password.html">Forgot Password?</a>

        </p>

        <p>

          Don't have an account?

          <a href="register.html">Create an Account</a>

        </p>

        <p>

          <a href="../index.html">Back to Home</a>
        </p>


      </form>

    </section>
    
    

  </main>

  <footer>

    <p>

      &copy 2026 Smart Student Career Portal

    </p>
    
  </footer>
  
</body>
</html>
