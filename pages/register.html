<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Student Career Portal</title>

    <link rel="stylesheet" href="../CSS/style.css">

</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>Smart Student Career Portal</h1>

        <h2>Create Account</h2>

        <p>

            Register to begin your learning and placement journey.

        </p>

        <form id="registerForm" action="#" method="post">

            <label for="fullname">

                Full Name

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

            <label for="phone">

                Phone Number

            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required>

            <label for="role">

                Role

            </label>

            <select id="role" required>

                <option value="">

                    Select your role

                </option>

                <option>

                    Student

                </option>

                <option>

                    Teacher

                </option>

                <option>

                    Administrator

                </option>

            </select>

            <label for="password">Password</label>

<div class="password-container">

<input
type="password"
id="password"
name="password"
placeholder="Create a password"
minlength="8"
required>

<span id="togglePassword1" class="eye-icon">

👁️

</span>

</div>

            <label for="confirmPassword">Confirm Password</label>

<div class="password-container">

<input
type="password"
id="confirmPassword"
name="confirmPassword"
placeholder="Re-enter your Password"
minlength="8"
required>

<span id="togglePassword2" class="eye-icon">

👁️

</span>

</div>

            <p id="passwordMessage"></p>

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        required>

                    I agree to the Terms & Conditions

                </label>

            </div>

            <button type="submit">

                Register

            </button>

        </form>

        <p class="register-link">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

        <p class="register-link">

            <a href="../index.html">

                ← Back to Home

            </a>

        </p>

    </div>

</div>

<script src="../JavaScript/register.js"></script>

</body>

</html>
